<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCarnet AI - Mes véhicules</title>
  <link rel="stylesheet" href="../public/css/style.css">
</head>
<body class="mobile-container">
  <main class="app-card">
    <header class="app-header">
      <h1 class="page-title">Mes véhicules</h1>
      <a href="login.html" class="logout-link">Déconnexion</a>
    </header>

    <!-- Carte Véhicule (cliquable vers le détail) -->
    <a href="detail.html" class="vehicle-card-link">
      <section class="vehicle-card">
        <div class="vehicle-info">
          <h2 class="vehicle-title">Citroën C4 Picasso</h2>
          <p class="vehicle-subtitle">1.5 BlueHDi • FG-660-DT</p>
        </div>
        
        <div class="vehicle-status-row">
          <span class="vehicle-mileage">162 000 km</span>
          <span class="badge badge-success">À jour</span>
        </div>
      </section>
    </a>

    <!-- Actions -->
    <div class="actions-group">
      <a href="add-maintenance.html" class="btn btn-primary">+ Ajouter un entretien</a>
      <button type="button" class="btn btn-secondary">+ Enregistrer un autre véhicule</button>
    </div>
  </main>
</body>
</html>
