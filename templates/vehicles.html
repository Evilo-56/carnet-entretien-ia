<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCarnet AI - Mes véhicules</title>
  <link rel="stylesheet" href="../public/css/style.css">
</head>
<body class="mobile-container">
  <main class="app-card">
    <!-- En-tête bien dimensionné : titre à gauche, bouton quitter à droite -->
    <header class="vehicles-header">
      <div>
        <h1 class="page-title">Mes véhicules</h1>
        <p class="header-subtitle">Gestion de votre flotte</p>
      </div>
      <button id="btnLogout" type="button" class="btn-logout" title="Se déconnecter">
        <span>Quitter</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </header>

    <!-- Bouton d'ajout pleine largeur : ergonomique et moderne -->
    <a href="add-vehicle.html" class="btn btn-primary btn-add-vehicle">
      + Ajouter un véhicule
    </a>

    <!-- Liste dynamique des cartes véhicules -->
    <div class="vehicles-list" id="vehiclesList">
      <p class="history-meta">Chargement des véhicules…</p>
    </div>
  </main>

  <script src="../public/js/app.js"></script>
</body>
</html>
