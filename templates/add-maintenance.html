<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCarnet AI - Nouvel entretien</title>
  <link rel="stylesheet" href="../public/css/style.css">
</head>
<body class="mobile-container">
  <main class="app-card">
    <!-- En-tête avec retour -->
    <header class="detail-header">
      <a href="detail.html" class="back-link">←</a>
      <h1 class="page-title">Nouvel entretien</h1>
    </header>

    <!-- Zone d'action OCR / Caméra -->
    <label for="invoiceFile" class="ocr-dropzone">
      <span class="ocr-icon">📷</span>
      <strong class="ocr-label">Scanner une facture</strong>
      <span class="ocr-sub">L'IA extrait automatiquement les données</span>
      <input type="file" id="invoiceFile" accept="image/*" capture="environment" hidden>
    </label>

    <!-- Formulaire d'entretien -->
    <form class="maintenance-form" id="maintenanceForm">
      <div class="form-field">
        <label for="date_intervention">Date de l'opération</label>
        <input type="date" id="date_intervention" value="2026-10-02" required>
      </div>

      <div class="form-field">
        <label for="kilometrage">Kilométrage</label>
        <input type="number" id="kilometrage" placeholder="ex. : 162 000" value="162000" required>
      </div>

      <div class="form-field">
        <label for="type_operation">Type d'intervention</label>
        <input type="text" id="type_operation" placeholder="ex. : Courroie de distribution" value="Courroie de distribution" required>
      </div>

      <div class="form-field">
        <label for="montant_ttc">Montant TTC (€)</label>
        <input type="number" step="0.01" id="montant_ttc" placeholder="ex. : 650.00" value="650.00" required>
      </div>

      <button type="submit" class="btn btn-primary btn-submit">Enregistrer l'entretien</button>
    </form>
  </main>
  <script src="../public/js/app.js"></script>
</body>
</html>
