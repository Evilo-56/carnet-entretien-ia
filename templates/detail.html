<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCarnet AI - Détail véhicule</title>
  <link rel="stylesheet" href="../public/css/style.css">
</head>
<body class="mobile-container">
  <main class="app-card">
    <!-- En-tête -->
    <header class="detail-header" style="justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <a href="vehicles.html" class="back-link">←</a>
        <div class="header-titles">
          <h1 class="page-title" id="vehicleTitle">Chargement…</h1>
          <p class="vehicle-subtitle" id="vehicleSubtitle">Chargement…</p>
        </div>
      </div>
      <a id="btnAddMaintenance" href="add-maintenance.html" class="btn btn-primary" style="padding: 6px 12px; font-size: 13px; text-decoration: none;">+ Entretien</a>
    </header>

    <!-- Bandeau des indicateurs clés (KPIs) -->
    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Budget total</span>
        <strong class="stat-value" id="statBudget">0,00 €</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">Entretiens</span>
        <strong class="stat-value" id="statCount">0</strong>
      </div>
    </section>

    <!-- Bloc Recommandations IA -->
    <section class="ai-card">
      <h2 class="ai-card-title">Recommandations IA</h2>
      <div id="predictionsContainer"></div>
    </section>

    <!-- Historique des interventions -->
    <section class="history-section">
      <h2 class="section-title">Historique des opérations</h2>
      <ul class="history-list" id="historyList"></ul>
    </section>
  </main>

  <script src="../public/js/app.js"></script>
</body>
</html>
