<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCarnet AI - Connexion</title>
  <link rel="stylesheet" href="../public/css/style.css">
</head>
<body class="mobile-container">
  <main class="app-card login-card">
    <header class="login-header">
      <h1 class="app-brand">AutoCarnet <span class="brand-ai">AI</span></h1>
      <p class="login-subtitle">Suivi intelligent de votre carnet d'entretien</p>
    </header>

    <form class="maintenance-form" id="loginForm">
      <div class="form-field">
        <label for="loginEmail">Adresse email</label>
        <input type="email" id="loginEmail" value="contact@autocarnet.fr" required>
      </div>

      <div class="form-field">
        <label for="loginPassword">Mot de passe</label>
        <input type="password" id="loginPassword" value="hash_test_123" required>
      </div>

      <p id="loginError" style="color: #ef4444; font-size: 13px; display: none;"></p>

      <button type="submit" class="btn btn-primary btn-submit">Se connecter</button>
    </form>
  </main>

  <script src="../public/js/app.js"></script>
</body>
</html>
